<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 12px Inter, Arial, sans-serif;
        color: #1f2937;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0 0 12px;
        color: #5b6770;
        line-height: 1.45;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 260px;
        padding: 10px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        resize: vertical;
      }

      button {
        width: 100%;
        min-height: 36px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        background: #123d40;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #f3f5f7;
        color: #123d40;
      }

      #status {
        margin-top: 12px;
        white-space: pre-wrap;
        color: #5b6770;
      }
    </style>
  </head>
  <body>
    <h1>Sarmayacar Quarterly Importer</h1>
    <p>Create the Sarmayacar report frames first, then paste the Figma data pack from Streamlit to fill company pages.</p>
    <textarea id="payload" placeholder="Paste Sarmayacar Quarterly Report JSON here"></textarea>
    <button id="create-template" class="secondary">Create XD-style template frames</button>
    <button id="import">Import company pages</button>
    <button id="cancel" class="secondary">Cancel</button>
    <div id="status"></div>

    <script>
      const payload = document.getElementById("payload");
      const status = document.getElementById("status");

      document.getElementById("create-template").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "create-template" } }, "*");
        status.textContent = "Creating template frames...";
      };

      document.getElementById("import").onclick = () => {
        let data;
        try {
          data = JSON.parse(payload.value);
        } catch (error) {
          status.textContent = "Invalid JSON: " + error.message;
          return;
        }
        parent.postMessage({ pluginMessage: { type: "import", data } }, "*");
        status.textContent = "Importing...";
      };

      document.getElementById("cancel").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      };

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "status") {
          status.textContent = message.text;
        }
      };
    </script>
  </body>
</html>
